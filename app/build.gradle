plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.minhcell.tracell'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.minhcell.TRACELLMOI"
        minSdk 23
        targetSdk 34
        versionCode ((System.getenv("VERSION_CODE") ?: "1").toInteger() + 200)
        versionName System.getenv("VERSION_NAME") ?: "2.0.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    // File .js du lieu BTS rat lon, khong nen nen lai lan nua
    androidResources {
        noCompress 'js'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
