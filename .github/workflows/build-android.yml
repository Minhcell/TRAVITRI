            || python3 -m pip install --quiet --break-system-packages --upgrade pillow \
            || true
          python3 - "$RES" <<'PY_EOF'
          import sys, os
          from PIL import Image
          res = sys.argv[1]
          src = Image.open('/tmp/icon-512.png').convert('RGBA')
          for name, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              d = os.path.join(res, 'mipmap-' + name)
              os.makedirs(d, exist_ok=True)
              src.resize((size,size), Image.LANCZOS).save(os.path.join(d,'ic_launcher.png'))
          d = os.path.join(res, 'drawable')
          os.makedirs(d, exist_ok=True)
          src.resize((384,384), Image.LANCZOS).save(os.path.join(d,'splash.png'))
          print('Da tao xong icon va splash')
          PY_EOF
          find "$RES" -name '*.png' -exec ls -l {} \;

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cai Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Khoi phuc keystore ky app
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Thieu secret KEYSTORE_BASE64."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/signing.keystore"
          ls -l "$RUNNER_TEMP/signing.keystore"

      - name: Build APK + AAB
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Gom file ket qua
        run: |
          mkdir -p dist
          find "${{ steps.find.outputs.dir }}" -name '*.apk' -path '*release*' -exec cp {} dist/TRA_CELL.apk \;
          find "${{ steps.find.outputs.dir }}" -name '*.aab' -path '*release*' -exec cp {} dist/TRA_CELL.aab \;
          ls -lh dist

      - name: Tai len artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRA_CELL-build-${{ github.run_number }}
          path: dist/*

      - name: Tao Release de tai APK ve may
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TRA CELL 1.0.${{ github.run_number }}
          body: |
            Ban build tu dong so ${{ github.run_number }}.
            Tai file TRA_CELL.apk roi cai truc tiep len may.
          files: |
            dist/TRA_CELL.apk
            dist/TRA_CELL.aab
