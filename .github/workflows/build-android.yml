name: Build APK TRA CELL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/settings.gradle'
      - '**/build.gradle'
      - '**/AndroidManifest.xml'
      - '**/res/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Tim thu muc du an Android
        id: find
        run: |
          echo "--- Cay thu muc repo (2 cap) ---"
          find . -path ./.git -prune -o -maxdepth 2 -print | sort
          echo "--------------------------------"
          SG=$(find . -path ./.git -prune -o -name settings.gradle -print 2>/dev/null | head -1)
          if [ -z "$SG" ]; then
            SG=$(find . -path ./.git -prune -o -name settings.gradle.kts -print 2>/dev/null | head -1)
          fi
          if [ -z "$SG" ]; then
            echo "::error::Khong tim thay settings.gradle trong repo."
            echo "::error::Nghia la cac file gradle chua duoc upload len GitHub."
            exit 1
          fi
          DIR=$(dirname "$SG")
          echo "Tim thay du an Android tai: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

