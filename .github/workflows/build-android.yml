name: Build APK TRA CELL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/settings.gradle'
      - '**/build.gradle'
      - '**/AndroidManifest.xml'
      - '**/res/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tìm thư mục dự án Android
        id: find
        run: |
          echo "--- Cây thư mục repo (2 cấp) ---"
          find . -path ./.git -prune -o -maxdepth 2 -print | sort
          echo "--------------------------------"
          SG=$(find . -path ./.git -prune -o -name settings.gradle -print 2>/dev/null | head -1)
          if [ -z "$SG" ]; then
            SG=$(find . -path ./.git -prune -o -name settings.gradle.kts -print 2>/dev/null | head -1)
          fi
          if [ -z "$SG" ]; then
            echo "::error::Khong tim thay settings.gradle trong repo."
            echo "::error::Nghia la thu muc android/ chua duoc upload len GitHub."
            echo "::error::Kiem tra trang chinh cua repo phai thay thu muc 'android'."
            exit 1
          fi
          DIR=$(dirname "$SG")
          echo "Tim thay du an Android tai: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "--- Noi dung ---"
          find "$DIR" -type f | sort

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Khôi phục keystore ký app
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Thieu secret KEYSTORE_BASE64. Vao Settings > Secrets and variables > Actions de them."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/signing.keystore"
          ls -l "$RUNNER_TEMP/signing.keystore"

      - name: Build APK + AAB
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Gom file kết quả
        run: |
          mkdir -p dist
          find "${{ steps.find.outputs.dir }}" -name '*.apk' -path '*release*' -exec cp {} dist/TRA_CELL.apk \;
          find "${{ steps.find.outputs.dir }}" -name '*.aab' -path '*release*' -exec cp {} dist/TRA_CELL.aab \;
          ls -lh dist

      - name: Tải lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRA_CELL-build-${{ github.run_number }}
          path: dist/*

      - name: Tạo Release để tải APK về máy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TRA CELL 1.0.${{ github.run_number }}
          body: |
            Bản build tự động số ${{ github.run_number }}.
            Tải file TRA_CELL.apk rồi cài trực tiếp lên máy.
          files: |
            dist/TRA_CELL.apk
            dist/TRA_CELL.aab
